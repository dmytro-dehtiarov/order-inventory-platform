name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run unit tests
        run: ./mvnw -B test -Dtest='!OrderInventoryPlatformApplicationTests' -DexcludedGroups=integration -Dsurefire.failIfNoSpecifiedTests=false

  integration-tests:
    # Only ever runs on push to main, never on pull_request. This repo is
    # public, and this job runs on a self-hosted runner with network access
    # to the Oracle VM: letting it trigger from pull_request would let a
    # fork's PR execute code on that runner. Restricting to push means only
    # code already merged by me reaches it.
    if: github.event_name == 'push'
    runs-on: [self-hosted, oracle-vm]
    env:
      DB_HOST: localhost
      DB_PORT: 1521
      DB_SERVICE: FREEPDB1
      TEST_DB_USER: ${{ secrets.TEST_DB_USER }}
      TEST_DB_PASSWORD: ${{ secrets.TEST_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run integration tests
        run: ./mvnw -B test -Dgroups=integration -Dsurefire.failIfNoSpecifiedTests=false